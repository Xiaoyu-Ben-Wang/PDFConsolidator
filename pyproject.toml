[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "consolidator"
version = "0.3.0"
description = "Convert a mixed folder of documents into a single merged PDF"
requires-python = ">=3.10"
# GPL-3.0-or-later, because the .msg reader (extract-msg) is GPL-3.0. Qt, img2pdf
# and RTFDE are LGPL-3.0, pikepdf is MPL-2.0 and the rest are permissive; none of
# those are compatible with a proprietary build, and all are with this one. See
# THIRD-PARTY-NOTICES.md for the full inventory.
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "THIRD-PARTY-NOTICES.md", "LICENSES/**"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business",
]
dependencies = [
    "pypdf>=6.0",
    "img2pdf>=0.6",
    "pillow>=10",
    "reportlab>=4",
    "extract-msg>=0.5",
    "pypdfium2>=4",
    "PySide6-Essentials>=6.6",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pyinstaller",
    "python-docx",
    "python-pptx",
    "openpyxl",
    "XlsxWriter",
]

[project.scripts]
consolidator = "consolidator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
